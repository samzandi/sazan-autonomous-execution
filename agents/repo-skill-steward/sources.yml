version: 1

skill_sources:
  - name: github-awesome-copilot
    repository: github/awesome-copilot
    purpose: curated agent and skill patterns
    trust: high
    action: review-before-use

  - name: skills-registry
    repository: nikships/skills-registry
    purpose: skill discovery and registry patterns
    trust: review
    action: sandbox-first

  - name: skills-cli
    repository: vercel-labs/skills
    purpose: skill CLI, discovery, update checks, and lifecycle management
    trust: high
    action: sandbox-first

  - name: repo-maintainer
    repository: Wolfe-Jam/faf-skills
    purpose: repository health, dependency, CI, documentation, and hygiene audit
    trust: review
    action: sandbox-first

  - name: anthropic-frontend-design
    repository: anthropics/claude-plugins-official
    purpose: canonical frontend visual-direction skill
    trust: high
    action: pinned-source-or-official-plugin

  - name: taste-skill
    repository: Leonxlnx/taste-skill
    purpose: specialist design, redesign, brandkit, mobile, and image-to-code skills
    trust: review
    action: selected-subskills-sandbox-first

  - name: vercel-web-design-guidelines
    repository: vercel-labs/agent-skills
    purpose: web UI standards and accessibility review
    trust: high
    action: pinned-source-only

  - name: awesome-design-md
    repository: VoltAgent/awesome-design-md
    purpose: design reference library
    trust: review
    action: reference-only

  - name: playwright-cli
    repository: microsoft/playwright-cli
    purpose: token-efficient browser verification for coding agents
    trust: high
    action: pinned-version-sandbox-first

update_sources:
  - name: renovate
    repository: renovatebot/renovate
    purpose: dependency update automation
    trust: high
    action: configure-per-repository

rules:
  require_provenance: true
  require_license_check: true
  require_security_review: true
  require_lab_test: true
  direct_main_updates: false
  persist_private_repo_inventory: false
  deduplicate_frontend_skills: true
  pin_frontend_guidance_sources: true
  forbid_mutable_runtime_design_rules: true
