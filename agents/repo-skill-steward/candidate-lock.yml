notes:
  - canonical sources are preferred over mirrors or aggregators
  - every executable candidate remains lab-only until runtime behavior is verified
  - readonly-smoke-passed does not authorize installation or mutation of real skill directories
  - static-review-passed means no separate executable payload was present in the candidate skill directory
  - skills-registry must not use its unverified latest installer path in steward-managed installations
  - hold-taxonomy-mismatch candidates must not be installed or used for compliance conclusions
  - no candidate is authorized to write to production repositories by discovery alone
