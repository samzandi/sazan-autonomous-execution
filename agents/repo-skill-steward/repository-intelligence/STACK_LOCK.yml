version: 2
verified_at: 2026-09-30
context: C001

components:
  - name: repomix
    role: primary-context-packer
    repository: yamadashy/repomix
    pinned_version: 1.18.1
    license: MIT
    status: proposed-primary-pending-lab
    evidence:
      - token-aware-packaging
      - git-aware-filtering
      - remote-repository-input
      - secretlint-backed-secret-detection
      - tree-sitter-compression
      - multi-format-output

  - name: gitingest
    role: lightweight-python-ingest-fallback
    repository: coderamp-labs/gitingest
    pinned_version: 0.3.1
    license: MIT
    status: proposed-fallback-pending-lab
    evidence:
      - cli
      - python-sync-api
      - python-async-api
      - url-ingest
      - gitignore-support
      - self-host-docker

  - name: code2prompt
    role: scoped-agent-context-and-mcp
    repository: mufeedvh/code2prompt
    pinned_version: 4.2.0
    license: MIT
    status: proposed-agent-path-pending-lab
    linux_x86_64_sha256: 69ff91f6e690de4814f38eb79d1fff5971d5a39bdc82b23ea784dcd450bf965f
    evidence:
      - rust-core
      - cli-and-tui
      - python-sdk
      - mcp
      - templates
      - token-estimation
      - git-integration

  - name: codegraph
    role: semantic-code-graph
    repository: codegraph-ai/CodeGraph
    license: Apache-2.0
    status: preferred-graph-candidate

  - name: gitdiagram
    role: architecture-visualization
    repository: ahmedkhaleel2004/gitdiagram
    license: MIT
    status: evaluate-for-promotion

  - name: deepwiki-open
    role: wiki-and-repository-qa
    repository: AsyncFuncAI/deepwiki-open
    license: MIT
    status: evaluate-for-promotion

  - name: serena
    role: semantic-editing-adapter
    repository: oraios/serena
    license: GPL-3.0-or-later-for-current-application-code
    status: external-adapter-only
    notes:
      - earlier releases remain under their historical licenses
      - current main application code must not be vendored into Sazan core without licensing review

  - name: gitreverse
    role: synthetic-prompt-reverse-engineering
    repository: filiksyos/gitreverse
    license: unknown-in-current-review
    status: reference-only

  - name: gitnexus
    role: benchmark-reference-architecture
    repository: nxpatterns/gitnexus
    license: PolyForm-Noncommercial-1.0.0
    status: reference-only-no-commercial-embedding

  - name: explaingithub
    role: repository-qa-reference
    repository: unknown
    license: unknown
    status: service-reference-only

context_packaging_routing:
  default: repomix
  scoped_agent_or_mcp: code2prompt
  lightweight_python_fallback: gitingest
  run_all_three_by_default: false

policy:
  unknown_license: reference-only
  noncommercial_license: no-commercial-embedding
  promotion_requires:
    - provenance
    - license-review
    - security-review
    - lab-evidence
    - capability-delta
    - rollback-path
