name: Feature request
description: Propose a focused execution-control or repository-intelligence improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: Explain how the behavior can be proven without weakening safety gates.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, and rollback
