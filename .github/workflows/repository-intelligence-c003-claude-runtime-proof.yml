name: Repository Intelligence C003 Claude Code Runtime Proof

on:
  pull_request:
    paths:
      - ".github/workflows/repository-intelligence-c003-claude-runtime-proof.yml"
      - "agents/repo-skill-steward/repository-intelligence/C003_CLAUDE_RUNTIME_PROOF.md"
      - "agents/repo-skill-steward/repository-intelligence/prompts/c003_claude_runtime_proof.md"
      - "agents/repo-skill-steward/repository-intelligence/schemas/c003_claude_runtime_proof.schema.json"
      - "agents/repo-skill-steward/repository-intelligence/scripts/validate_c003_claude_runtime_proof.py"
      - "tests/test_repository_intelligence_c003_claude_runtime_proof.py"
      - "agents/repo-skill-steward/repository-intelligence/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  claude-runtime-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Require Claude authentication
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANTHROPIC_API_KEY:-}" ] && [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::C003 live Claude proof is BLOCKED: configure ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN."
            exit 20
          fi
          echo "Claude authentication prerequisite is configured."

      - name: Validate proof tooling
        run: |
          python3 -m py_compile agents/repo-skill-steward/repository-intelligence/scripts/validate_c003_claude_runtime_proof.py
          python3 -m unittest tests/test_repository_intelligence_c003_claude_runtime_proof.py

      - name: Produce deterministic C002 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 agents/repo-skill-steward/repository-intelligence/scripts/run_c002_e2e_lab.py             --output "$RUNNER_TEMP/c002-e2e-baseline.json"             --require-verified

      - name: Load proof prompt
        id: proof_prompt
        shell: bash
        run: |
          {
            echo "prompt<<__C003_PROMPT__"
            cat agents/repo-skill-steward/repository-intelligence/prompts/c003_claude_runtime_proof.md
            echo "__C003_PROMPT__"
          } >> "$GITHUB_OUTPUT"

      - name: Run live Claude Code proof
        id: claude
        uses: anthropics/claude-code-action@12dd8d74c712f5f3669365b2369b558c495b1104
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.proof_prompt.outputs.prompt }}
          display_report: "false"
          show_full_output: "false"
          claude_args: |
            --model claude-opus-5
            --permission-mode auto
            --max-turns 10
            --json-schema '{"type":"object","additionalProperties":false,"required":["schema_version","status","runtime","checks","evidence","blockers"],"properties":{"schema_version":{"type":"integer","const":1},"status":{"type":"string","enum":["verified","blocked"]},"runtime":{"type":"object","additionalProperties":false,"required":["name","repository_head","model","cli_version"],"properties":{"name":{"type":"string","const":"claude-code"},"repository_head":{"type":"string","minLength":40,"maxLength":64},"model":{"type":"string","const":"claude-opus-5"},"cli_version":{"type":"string","minLength":1,"maxLength":120}}},"checks":{"type":"object","additionalProperties":false,"required":["repository_head_matches","c002_end_to_end_passed","c002_orchestration_passed","parent_review_gate_observed","auto_promotion_disabled","private_identity_redaction_observed","workspace_unchanged"],"properties":{"repository_head_matches":{"type":"boolean"},"c002_end_to_end_passed":{"type":"boolean"},"c002_orchestration_passed":{"type":"boolean"},"parent_review_gate_observed":{"type":"boolean"},"auto_promotion_disabled":{"type":"boolean"},"private_identity_redaction_observed":{"type":"boolean"},"workspace_unchanged":{"type":"boolean"}}},"evidence":{"type":"array","minItems":4,"items":{"type":"string","minLength":1,"maxLength":300}},"blockers":{"type":"array","items":{"type":"string","minLength":1,"maxLength":300}}}}'
            --allowedTools "Read,Grep,Glob,Bash(git rev-parse HEAD),Bash(git status --porcelain),Bash(claude --version),Bash(python3 -m unittest tests/test_repository_intelligence_e2e.py tests/test_repository_intelligence_orchestration.py),Bash(python3 agents/repo-skill-steward/repository-intelligence/scripts/run_c002_e2e_lab.py --output /tmp/c002-claude-runtime-proof.json --require-verified)"

      - name: Persist structured Claude output
        shell: bash
        env:
          STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        run: |
          set -euo pipefail
          test -n "$STRUCTURED_OUTPUT"
          printf '%s\n' "$STRUCTURED_OUTPUT" > "$RUNNER_TEMP/c003-claude-output.json"

      - name: Capture runtime metadata
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          BASELINE_SHA="$(sha256sum "$RUNNER_TEMP/c002-e2e-baseline.json" | awk '{print $1}')"
          python3 - "$RUNNER_TEMP/c003-runtime-metadata.json" "$EXPECTED_HEAD" "$BASELINE_SHA" <<'PY'
          import json
          import pathlib
          import sys

          path, head, baseline_sha = sys.argv[1:]
          payload = {
              "schema_version": 1,
              "head_sha": head,
              "model": "claude-opus-5",
              "expected_claude_code_version": "2.1.286",
              "action_commit": "12dd8d74c712f5f3669365b2369b558c495b1104",
              "baseline_sha256": baseline_sha,
          }
          pathlib.Path(path).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          PY

      - name: Independently validate live Claude evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 agents/repo-skill-steward/repository-intelligence/scripts/validate_c003_claude_runtime_proof.py             --claude-output "$RUNNER_TEMP/c003-claude-output.json"             --baseline "$RUNNER_TEMP/c002-e2e-baseline.json"             --metadata "$RUNNER_TEMP/c003-runtime-metadata.json"             --report "$RUNNER_TEMP/c003-claude-runtime-proof-report.json"             --require-verified

      - name: Publish C003 Claude evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/c003-claude-runtime-proof-report.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          runtime = report["runtime"]
          print("## C003 Claude Code Runtime Proof")
          print()
          print(f"- Status: {report['status']}")
          print(f"- Repository HEAD: {runtime['repository_head']}")
          print(f"- Claude Code CLI: {runtime['cli_version']}")
          print(f"- Model: {runtime['model']}")
          print(f"- Claude Action commit: {runtime['action_commit']}")
          print(f"- C002 baseline: {report['baseline']['status']}")
          print(f"- Promotion boundary: {report['baseline']['orchestration_status']}")
          print("- Auto-promotion remained disabled.")
          print("- Private repository identity redaction remained enforced.")
          PY
