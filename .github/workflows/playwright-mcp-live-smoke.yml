name: Playwright MCP Live Smoke

on:
  push:
    branches: [main]
    paths:
      - "agents/repo-skill-steward/mcp/playwright-**"
      - "agents/repo-skill-steward/mcp/playwright_**"
      - "tests/test_playwright_mcp_proxy.py"
      - ".github/workflows/playwright-mcp-live-smoke.yml"
      - ".sazan/**"
  pull_request:
    paths:
      - "agents/repo-skill-steward/mcp/playwright-**"
      - "agents/repo-skill-steward/mcp/playwright_**"
      - "tests/test_playwright_mcp_proxy.py"
      - ".github/workflows/playwright-mcp-live-smoke.yml"
      - ".sazan/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify Chrome
        run: google-chrome --version

      - name: Verify pinned Playwright MCP profile
        run: python agents/repo-skill-steward/mcp/playwright_mcp_proxy.py --dry-run

      - name: Run governed browser smoke proof
        run: python agents/repo-skill-steward/mcp/playwright_mcp_live_smoke.py
