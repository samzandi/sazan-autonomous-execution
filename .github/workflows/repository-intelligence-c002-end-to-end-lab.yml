name: Repository Intelligence C002 End-to-End Lab

on:
  pull_request:
    paths:
      - ".github/workflows/repository-intelligence-c002-end-to-end-lab.yml"
      - "agents/repo-skill-steward/repository-intelligence/**"
      - "tests/test_repository_intelligence_e2e.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c002-end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile end-to-end lab
        run: python3 -m py_compile agents/repo-skill-steward/repository-intelligence/scripts/run_c002_e2e_lab.py

      - name: Run C002 end-to-end unit tests
        run: python3 -m unittest tests/test_repository_intelligence_e2e.py

      - name: Run C002 regression suite
        run: |
          python3 -m unittest             tests/test_repository_intelligence_orchestration.py             tests/test_repository_intelligence_multirepo.py             tests/test_repository_intelligence_process_flow.py             tests/test_repository_intelligence_diff_impact.py             tests/test_repository_intelligence_budget.py             tests/test_repository_intelligence_provider_health.py             tests/test_repository_intelligence_provider_routing_integration.py             tests/test_repository_intelligence_incremental_cache.py

      - name: Execute realistic end-to-end lab
        shell: bash
        run: |
          set -euo pipefail
          python3 agents/repo-skill-steward/repository-intelligence/scripts/run_c002_e2e_lab.py             --output "$RUNNER_TEMP/c002-e2e-report.json"             --require-verified
          python3 - "$RUNNER_TEMP/c002-e2e-report.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["status"] == "verified"
          assert all(report["checks"].values())
          assert report["summary"]["matched_contracts"] == 3
          assert report["summary"]["flows"] == 1
          assert report["summary"]["impact_level"] == "high"
          assert report["summary"]["provider_fallback"]["fallback_used"] is True
          assert report["summary"]["cache"]["cross_revision_reuse"] is True
          assert report["summary"]["orchestration"]["status"] == "ready-for-parent-review"
          text = json.dumps(report, sort_keys=True)
          assert "secret-owner" not in text
          assert "private-payments-worker" not in text
          PY

      - name: Publish C002 end-to-end evidence
        shell: bash
        run: |
          {
            echo "## C002 Realistic End-to-End Integration Lab"
            echo
            echo "- Multi-repository registry and three matched contracts validated."
            echo "- Observed cross-repository execution flow validated."
            echo "- Cross-repository diff impact propagated to downstream review."
            echo "- Repomix health failure exercised the promoted Gitingest fallback."
            echo "- Strict budget telemetry remained within limits."
            echo "- Cross-revision cache reuse succeeded only under stable fingerprints."
            echo "- L7 reached ready-for-parent-review with auto-promotion disabled."
            echo "- Private repository source identity was absent from persisted outputs."
          } >> "$GITHUB_STEP_SUMMARY"
