name: Repo Skill Steward CI

on:
  pull_request:
    paths:
      - "agents/repo-skill-steward/**"
      - "tests/repo-skill-steward-scenarios.md"
      - "tests/test_repo_skill_steward.py"
      - "tests/test_repo_skill_steward_report.py"
      - ".github/workflows/repo-skill-steward-ci.yml"
      - ".github/workflows/repo-skill-steward-scheduled-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile steward scripts
        run: |
          python3 -m py_compile agents/repo-skill-steward/scripts/inventory.py
          python3 -m py_compile agents/repo-skill-steward/scripts/classify.py
          python3 -m py_compile agents/repo-skill-steward/scripts/report.py
          python3 -m py_compile agents/repo-skill-steward/scripts/skill_drift.py

      - name: Check CLI help
        run: |
          python3 agents/repo-skill-steward/scripts/inventory.py --help >/dev/null
          python3 agents/repo-skill-steward/scripts/classify.py --help >/dev/null
          python3 agents/repo-skill-steward/scripts/report.py --help >/dev/null
          python3 agents/repo-skill-steward/scripts/skill_drift.py --help >/dev/null

      - name: Run steward unit tests
        run: |
          python3 -m unittest tests/test_repo_skill_steward.py
          python3 -m unittest tests/test_repo_skill_steward_report.py
          python3 -m unittest tests/test_repo_skill_steward_skill_drift.py

      - name: Verify missing-token safety
        shell: bash
        run: |
          set +e
          env -u GITHUB_TOKEN python3 agents/repo-skill-steward/scripts/inventory.py >/tmp/steward.out 2>/tmp/steward.err
          code=$?
          set -e
          test "$code" -eq 2
          grep -q "GITHUB_TOKEN is required." /tmp/steward.err

      - name: Verify safety defaults
        shell: bash
        run: |
          grep -q "direct_main_updates: false" agents/repo-skill-steward/sources.yml
          grep -q "persist_private_repo_inventory: false" agents/repo-skill-steward/sources.yml
          grep -q "install_status: not-installed" agents/repo-skill-steward/candidate-lock.yml
          grep -q "auto_merge.*False" agents/repo-skill-steward/scripts/classify.py
          grep -q "permissions:" .github/workflows/repo-skill-steward-scheduled-audit.yml
          grep -q "contents: read" .github/workflows/repo-skill-steward-scheduled-audit.yml

  secure-installer-posix-dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify POSIX installer dry-run
        shell: bash
        run: |
          set -euo pipefail
          sh agents/repo-skill-steward/installers/skills-registry-secure.sh > "$RUNNER_TEMP/registry-plan.json"
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "registry-plan.json")
          with open(path, encoding="utf-8") as handle:
              plan = json.load(handle)
          assert plan["version"] == "v0.5.50"
          assert plan["mode"] == "dry-run"
          assert len(plan["sha256"]) == 64
          PY

  secure-installer-windows-dryrun:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Windows installer dry-run
        shell: pwsh
        run: |
          $out = & ".\agents\repo-skill-steward\installers\skills-registry-secure.ps1"
          $plan = $out | ConvertFrom-Json
          if ($plan.version -ne "v0.5.50") { throw "unexpected version" }
          if ($plan.mode -ne "dry-run") { throw "installer did not default to dry-run" }
          if ($plan.sha256.Length -ne 64) { throw "invalid SHA-256 length" }
