name: Ponytail PR1 Cross-Repo Lab

on:
  pull_request:
    paths:
      - ".github/workflows/ponytail-pr1-cross-repo-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ponytail-pr1-smoke:
    runs-on: ubuntu-latest
    env:
      PONYTAIL_REPO: https://github.com/samzandi/ponytail.git
      PONYTAIL_SHA: 2dd308e1a02d727dcd1a6bdeb60b6129a6f3d5de
    steps:
      - name: Checkout steward
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.20.0"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Checkout exact Ponytail PR commit without credentials
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= clone --filter=blob:none --no-checkout "$PONYTAIL_REPO" "$RUNNER_TEMP/ponytail"
          git -C "$RUNNER_TEMP/ponytail" fetch --depth=1 origin "$PONYTAIL_SHA"
          git -C "$RUNNER_TEMP/ponytail" checkout --detach "$PONYTAIL_SHA"
          test "$(git -C "$RUNNER_TEMP/ponytail" rev-parse HEAD)" = "$PONYTAIL_SHA"

      - name: Install Python correctness dependency
        working-directory: ${{ runner.temp }}/ponytail
        run: python -m pip install pandas

      - name: Install MCP dependencies
        working-directory: ${{ runner.temp }}/ponytail
        run: npm install --prefix ponytail-mcp

      - name: Check rule copies
        working-directory: ${{ runner.temp }}/ponytail
        run: node scripts/check-rule-copies.js

      - name: Check version consistency
        working-directory: ${{ runner.temp }}/ponytail
        run: node scripts/check-versions.js

      - name: Run full Ponytail tests
        working-directory: ${{ runner.temp }}/ponytail
        run: npm test
