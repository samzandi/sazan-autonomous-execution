name: Ponytail PR1 Cross-Repo Lab

on:
  pull_request:
    paths:
      - ".github/workflows/ponytail-pr1-cross-repo-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ponytail-pr1-smoke:
    runs-on: ubuntu-latest
    env:
      PONYTAIL_REPO: https://github.com/samzandi/ponytail.git
      PONYTAIL_BASE_SHA: 8abea6c8d23c8d335196360292e6fb453627dbf4
      PONYTAIL_PR_SHA: 2dd308e1a02d727dcd1a6bdeb60b6129a6f3d5de
    steps:
      - name: Checkout steward
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.20.0"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Clone Ponytail without credentials
        shell: bash
        run: |
          set -euo pipefail
          git -c credential.helper= clone --filter=blob:none --no-checkout "$PONYTAIL_REPO" "$RUNNER_TEMP/ponytail"
          git -C "$RUNNER_TEMP/ponytail" fetch --depth=1 origin "$PONYTAIL_BASE_SHA" "$PONYTAIL_PR_SHA"

      - name: Capture baseline rule-copy drift
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/ponytail"
          git -C "$repo" checkout --detach "$PONYTAIL_BASE_SHA"
          set +e
          (cd "$repo" && node scripts/check-rule-copies.js) > "$RUNNER_TEMP/base-rules.log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep "drifted from AGENTS.md" "$RUNNER_TEMP/base-rules.log" | sort > "$RUNNER_TEMP/base-drift.txt"
          test -s "$RUNNER_TEMP/base-drift.txt"

      - name: Verify PR has no new rule-copy drift
        shell: bash
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/ponytail"
          git -C "$repo" checkout --detach "$PONYTAIL_PR_SHA"
          set +e
          (cd "$repo" && node scripts/check-rule-copies.js) > "$RUNNER_TEMP/pr-rules.log" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 1
          grep "drifted from AGENTS.md" "$RUNNER_TEMP/pr-rules.log" | sort > "$RUNNER_TEMP/pr-drift.txt"
          diff -u "$RUNNER_TEMP/base-drift.txt" "$RUNNER_TEMP/pr-drift.txt"

      - name: Install Python correctness dependency
        working-directory: ${{ runner.temp }}/ponytail
        run: python -m pip install pandas

      - name: Install MCP dependencies
        working-directory: ${{ runner.temp }}/ponytail
        run: npm install --prefix ponytail-mcp

      - name: Check version consistency
        working-directory: ${{ runner.temp }}/ponytail
        run: node scripts/check-versions.js

      - name: Run full Ponytail tests
        working-directory: ${{ runner.temp }}/ponytail
        run: npm test
