name: Repository Intelligence C003 Runtime Parity Lab

on:
  pull_request:
    paths:
      - ".github/workflows/repository-intelligence-c003-runtime-parity-lab.yml"
      - "agents/repo-skill-steward/repository-intelligence/C003_RUNTIME_CONTRACT_PARITY.md"
      - "agents/repo-skill-steward/repository-intelligence/scripts/runtime_contract_parity.py"
      - "tests/test_repository_intelligence_c003_runtime_parity.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Compile parity evaluator
        run: python3 -m py_compile agents/repo-skill-steward/repository-intelligence/scripts/runtime_contract_parity.py

      - name: Run parity contract tests
        run: python3 -m unittest tests/test_repository_intelligence_c003_runtime_parity.py

      - name: Exercise verified parity fixture through CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/codex.json" "$RUNNER_TEMP/claude.json" <<'PY'
          import json
          import pathlib
          import sys

          common = {
              "repository_head_matches": True,
              "model_matches": True,
              "cli_version_matches": True,
              "baseline_verified": True,
              "parent_review_boundary": True,
              "focused_tests_reported": True,
              "private_identity_redaction": True,
              "workspace_unchanged": True,
              "evidence_present": True,
              "no_sensitive_markers": True,
          }
          head = "a" * 40
          baseline_sha = "b" * 64
          codex = {
              "schema_version": 1,
              "context": "C003",
              "status": "verified",
              "runtime": {
                  "name": "codex",
                  "repository_head": head,
                  "model": "gpt-5.6-sol",
                  "codex_cli_version": "0.159.2",
                  "action_commit": "c" * 40,
              },
              "checks": common,
              "baseline": {
                  "status": "verified",
                  "sha256": baseline_sha,
                  "orchestration_status": "ready-for-parent-review",
              },
              "blockers": [],
          }
          claude = {
              "schema_version": 1,
              "context": "C003",
              "status": "verified",
              "runtime": {
                  "name": "claude-code",
                  "repository_head": head,
                  "model": "claude-opus-5",
                  "cli_version": "2.1.286",
                  "action_commit": "d" * 40,
              },
              "checks": common,
              "baseline": {
                  "status": "verified",
                  "sha256": baseline_sha,
                  "orchestration_status": "ready-for-parent-review",
              },
              "blockers": [],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(codex))
          pathlib.Path(sys.argv[2]).write_text(json.dumps(claude))
          PY

          python3 agents/repo-skill-steward/repository-intelligence/scripts/runtime_contract_parity.py             --codex-report "$RUNNER_TEMP/codex.json"             --claude-report "$RUNNER_TEMP/claude.json"             --expected-head "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"             --output "$RUNNER_TEMP/parity.json"             --require-verified

          python3 - "$RUNNER_TEMP/parity.json" <<'PY'
          import json
          import pathlib
          import sys

          report = json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert report["status"] == "verified"
          assert all(report["parity_checks"].values())
          assert report["blockers"] == []
          PY

      - name: Publish parity engine evidence
        shell: bash
        run: |
          {
            echo "## C003 Runtime / Provider Contract Parity"
            echo
            echo "- Fail-closed provider proof normalization validated."
            echo "- Same-HEAD requirement validated."
            echo "- Same deterministic-baseline requirement validated."
            echo "- Parent-review boundary parity validated."
            echo "- Provider-specific model/version differences remain allowed."
            echo "- Sensitive-marker and provider-blocker rejection validated."
            echo "- Live parity verdict remains dependent on verified Codex and Claude runtime proofs."
          } >> "$GITHUB_STEP_SUMMARY"
