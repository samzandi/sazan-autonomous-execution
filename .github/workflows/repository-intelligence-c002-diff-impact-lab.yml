name: Repository Intelligence C002 Diff Impact Lab

on:
  pull_request:
    paths:
      - ".github/workflows/repository-intelligence-c002-diff-impact-lab.yml"
      - "agents/repo-skill-steward/repository-intelligence/**"
      - "tests/test_repository_intelligence_diff_impact.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run evidence-first diff impact lab
        shell: bash
        run: bash agents/repo-skill-steward/repository-intelligence/scripts/run_diff_impact_lab.sh

      - name: Publish evidence
        if: success()
        shell: bash
        run: |
          {
            echo "## C002 Diff → Impact Revalidation"
            echo
            echo "- Real git diff analyzed through CodeGraph pr_context."
            echo "- Provider local risk and related tests preserved."
            echo "- Explicit contract touch expanded factual cross-repository blast radius."
            echo "- No synthetic global risk score produced."
            echo "- Incomplete file-only evidence downgraded to partial-evidence."
            echo "- Private repository source identity remained absent."
          } >> "$GITHUB_STEP_SUMMARY"
