name: Frontend Design Stack Candidate Lab

on:
  pull_request:
    paths:
      - "agents/repo-skill-steward/frontend-design-stack.yml"
      - "agents/repo-skill-steward/frontend-quality-gate.md"
      - "agents/repo-skill-steward/candidate-lock.yml"
      - "agents/repo-skill-steward/vendor/vercel-web-interface-guidelines/**"
      - ".github/workflows/frontend-design-stack-candidate-lab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-source-static-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout steward
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify Anthropic frontend-design pin
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/anthropic-plugins"
          git init "$target"
          git -C "$target" remote add origin https://github.com/anthropics/claude-plugins-official.git
          git -C "$target" fetch --depth=1 origin d182ca456ca09d31d139f7d3818d1d333b103cce
          git -C "$target" checkout --detach FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "d182ca456ca09d31d139f7d3818d1d333b103cce"
          test -f "$target/plugins/frontend-design/skills/frontend-design/SKILL.md"

      - name: Verify selected Taste Skill surface
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/taste-skill"
          git init "$target"
          git -C "$target" remote add origin https://github.com/Leonxlnx/taste-skill.git
          git -C "$target" fetch --depth=1 origin ce26fc25c0e5e8cab638f883de62d9a86ee5e45b
          git -C "$target" checkout --detach FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "ce26fc25c0e5e8cab638f883de62d9a86ee5e45b"
          for d in image-to-code-skill minimalist-skill redesign-skill brandkit imagegen-frontend-mobile imagegen-frontend-web; do
            test -f "$target/skills/$d/SKILL.md"
            extras="$(find "$target/skills/$d" -type f ! -name SKILL.md -print)"
            test -z "$extras"
          done

      - name: Verify vendored Vercel guidelines
        shell: bash
        run: |
          set -euo pipefail
          path="agents/repo-skill-steward/vendor/vercel-web-interface-guidelines/command.md"
          test -f "$path"
          test "$(git hash-object "$path")" = "e1e8e3460db7c1440e34642c4f7b885185ca5366"
          grep -q "Upstream commit: e3d624baaf29dc1fc645aff3e38f03e564d2d6b1" agents/repo-skill-steward/vendor/vercel-web-interface-guidelines/SOURCE.md
          grep -q "no_runtime_remote_rules: true" agents/repo-skill-steward/frontend-design-stack.yml

      - name: Verify Awesome Design MD reference pin
        shell: bash
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/awesome-design-md"
          git init "$target"
          git -C "$target" remote add origin https://github.com/VoltAgent/awesome-design-md.git
          git -C "$target" fetch --depth=1 origin f6961238d5cddcf8042a74a70fc400ec67181abb
          git -C "$target" checkout --detach FETCH_HEAD
          test "$(git -C "$target" rev-parse HEAD)" = "f6961238d5cddcf8042a74a70fc400ec67181abb"
          test -d "$target/design-md"

  playwright-cli-isolated-smoke:
    runs-on: ubuntu-latest
    env:
      npm_config_ignore_scripts: "true"
      DO_NOT_TRACK: "1"
    steps:
      - name: Checkout steward
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.20.0"

      - name: Create isolated home
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/frontend-lab-home" "$RUNNER_TEMP/playwright-cli"
          echo "HOME=$RUNNER_TEMP/frontend-lab-home" >> "$GITHUB_ENV"
          echo "npm_config_cache=$RUNNER_TEMP/frontend-npm-cache" >> "$GITHUB_ENV"

      - name: Install pinned package without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/playwright-cli" @playwright/cli@0.1.22
          node -e 'const p=require(process.env.RUNNER_TEMP+"/playwright-cli/node_modules/@playwright/cli/package.json"); if(p.version!=="0.1.22") process.exit(1)'

      - name: Run read-only CLI smoke
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/playwright-cli/node_modules/.bin/playwright-cli"
          "$bin" --help >/dev/null
          test ! -e .playwright-cli

      - name: Install skills only into isolated agent home
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/playwright-cli/node_modules/.bin/playwright-cli"
          "$bin" install --skills=agents -g
          test -d "$HOME/.agents/skills"
          find "$HOME/.agents/skills" -type f -name SKILL.md -print -quit | grep -q SKILL.md
          test ! -e .agents
          test ! -e .claude
