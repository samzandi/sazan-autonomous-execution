name: Context7 MCP Live Smoke

on:
  push:
    branches: [main]
    paths:
      - "agents/repo-skill-steward/mcp/context7-**"
      - "agents/repo-skill-steward/mcp/context7_**"
      - "tests/test_context7_mcp_proxy.py"
      - ".github/workflows/context7-mcp-live-smoke.yml"
      - ".sazan/**"
  pull_request:
    paths:
      - "agents/repo-skill-steward/mcp/context7-**"
      - "agents/repo-skill-steward/mcp/context7_**"
      - "tests/test_context7_mcp_proxy.py"
      - ".github/workflows/context7-mcp-live-smoke.yml"
      - ".sazan/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify pinned Context7 MCP profile
        run: python agents/repo-skill-steward/mcp/context7_mcp_proxy.py --dry-run

      - name: Run live Context7 documentation proof
        run: python agents/repo-skill-steward/mcp/context7_mcp_live_smoke.py
